 {id:'u01',icon:'👋',title:'你好，我叫…',sub:'打招呼 · 介绍名字',tag:'第一课复习',grammar:'ich = 我；heiße = 名叫。先把整句当成一个表达来记，不必背变位。',items:[['Hallo!','你好！'],['Ich heiße Xiao Ming.','我叫小明。'],['Wie heißt du?','你叫什么名字？'],['Ich heiße Lisa.','我叫丽莎。'],['Und du?','你呢？'],['Freut mich!','很高兴认识你！']],mission:['对新认识的同事打招呼，介绍自己。','Hallo! Ich heiße Xiao Ming.']},
 {id:'u02',icon:'🌅',title:'礼貌问候',sub:'早上好 · 再见 · 谢谢',tag:'基础交流',grammar:'Guten Morgen 早上用；Guten Tag 白天用；Guten Abend 晚上用。Bitte 可以表示“请”或“不客气”。',items:[['Guten Morgen!','早上好！'],['Guten Tag!','你好！（白天）'],['Guten Abend!','晚上好！'],['Auf Wiedersehen!','再见！（正式）'],['Danke schön!','非常感谢！'],['Bitte schön!','不客气！']],mission:['向刚到办公室的同事说“早上好”。','Guten Morgen!']},
 {id:'u03',icon:'🙂',title:'你好吗？',sub:'寒暄 · 回应 · 告别',tag:'基础交流',grammar:'Wie geht’s dir? 是熟人之间的问候；Mir geht’s gut. 表示“我很好”。',items:[['Wie geht’s dir?','你好吗？'],['Mir geht’s gut.','我很好。'],['Und dir?','你呢？'],['Es geht.','还行。'],['Mir geht’s nicht so gut.','我不太好。'],['Bis bald!','回头见！']],mission:['朋友问你最近怎么样，你回答“我很好”。','Mir geht’s gut.']},
 {id:'u04',icon:'🌍',title:'来自哪里？',sub:'国家 · 语言 · 居住地',tag:'个人信息',grammar:'aus + 国家常用于“来自哪里”；in + 城市常用于“住在哪”。德语名词首字母大写。',items:[['Woher kommst du?','你来自哪里？'],['Ich komme aus China.','我来自中国。'],['Wo wohnst du?','你住在哪里？'],['Ich wohne in Shanghai.','我住在上海。'],['Ich lerne Deutsch.','我在学德语。'],['Ich spreche Chinesisch und Englisch.','我会说中文和英语。']],mission:['告诉别人你来自中国，目前正在学德语。','Ich komme aus China. Ich lerne Deutsch.']},
 {id:'u05',icon:'🔢',title:'数字 1–10',sub:'数字 · 基础听辨',tag:'语音基础',grammar:'数字首先练“听到声音→知道数字”。德语数字的读音要靠真实音频记忆，不靠中文谐音。',items:[['eins','一'],['zwei','二'],['drei','三'],['vier','四'],['fünf','五'],['sechs','六'],['sieben','七'],['acht','八'],['neun','九'],['zehn','十']],mission:['用德语说出数字：一、二、三。','eins, zwei, drei']},
 {id:'u06',icon:'🎂',title:'年龄和电话',sub:'数字 · 年龄 · 联系方式',tag:'个人信息',grammar:'Ich bin ... Jahre alt. = 我……岁。德语年龄用 bin（是），不用 heiße。',items:[['Wie alt bist du?','你几岁？'],['Ich bin siebenundzwanzig Jahre alt.','我二十七岁。'],['Wie ist deine Telefonnummer?','你的电话号码是多少？'],['Meine Nummer ist null eins zwei.','我的号码是零一二。'],['Kannst du das wiederholen?','你能重复一遍吗？'],['Langsam, bitte.','请慢一点。']],mission:['用德语请求对方说慢一点。','Langsam, bitte.']},
 {id:'u07',icon:'👨‍👩‍👧',title:'家人和朋友',sub:'家庭 · 人称 · 介绍',tag:'个人信息',grammar:'mein = 我的（部分阳性/中性名词前）；meine = 我的（阴性/复数名词前）。先观察例句。',items:[['Das ist meine Mutter.','这是我妈妈。'],['Das ist mein Vater.','这是我爸爸。'],['Ich habe eine Schwester.','我有一个姐妹。'],['Ich habe einen Bruder.','我有一个兄弟。'],['Hast du Geschwister?','你有兄弟姐妹吗？'],['Meine Familie wohnt in China.','我的家人住在中国。']],mission:['介绍“这是我爸爸”。','Das ist mein Vater.']},
 {id:'u08',icon:'💼',title:'职业是什么？',sub:'工作 · 个人经历',tag:'职业场景',grammar:'Ich arbeite als ... = 我的工作是……；Was machst du beruflich? = 你做什么工作？',items:[['Was machst du beruflich?','你做什么工作？'],['Ich arbeite als Produktmanager.','我是产品经理。'],['Ich arbeite in einer Firma.','我在一家公司工作。'],['Ich habe heute frei.','我今天休息。'],['Ich suche Arbeit.','我在找工作。'],['Ich möchte in Deutschland arbeiten.','我想去德国工作。']],mission:['告诉别人你是产品经理。','Ich arbeite als Produktmanager.']},
 {id:'u09',icon:'🥐',title:'早餐和点餐',sub:'餐厅 · 咖啡 · 想要',tag:'日常生活',grammar:'Ich möchte ... = 我想要……；Ich hätte gern ... 更礼貌，适合餐厅点餐。',items:[['Ich hätte gern einen Kaffee.','我想要一杯咖啡。'],['Ein Wasser, bitte.','请来一杯水。'],['Ich möchte ein Brötchen.','我想要一个小圆面包。'],['Was möchten Sie?','您想要什么？'],['Die Rechnung, bitte.','请结账。'],['Das schmeckt gut.','这个很好吃。']],mission:['在德国咖啡馆点一杯咖啡。','Ich hätte gern einen Kaffee.']},
 {id:'u10',icon:'🛍️',title:'买东西',sub:'价格 · 支付 · 数量',tag:'日常生活',grammar:'Was kostet ...? 用于问价格；Kann ich ...? 用于礼貌地问“我能……吗？”',items:[['Was kostet das?','这个多少钱？'],['Das kostet zehn Euro.','这个十欧元。'],['Das ist zu teuer.','太贵了。'],['Ich nehme das.','我要这个。'],['Kann ich mit Karte bezahlen?','可以刷卡吗？'],['Haben Sie eine Tüte?','您有袋子吗？']],mission:['在商店询问能否刷卡。','Kann ich mit Karte bezahlen?']},

</script><script>
(() => {
'use strict';
const STORE='deutschSprintA1_v1';
const MS_DAY=86400000;
const $=s=>document.querySelector(s);
const safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const quote=x=>safe(x).replace(/\n/g,'<br>');
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const dayLabel=()=>new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});
const initial=()=>({version:1,name:'Xiao Ming',daily:15,rate:.88,completed:{},reviews:{},dates:[],minutes:{},quizzes:[],missionChecks:{},skills:{read:[],listen:[],write:[],speak:[]}});
function load(){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(!x||x.version!==1||typeof x.completed!=='object'||typeof x.reviews!=='object')return initial();return {...initial(),...x}}catch{return initial()}}
let state=load();let page='home';let session=null;let review=null;let practice=null;let listening=false;let speechTimer=null;
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(state))}catch{toast('浏览器未开放本地存储，进度可能无法保存')}};
function toast(s){const root=$('#toastSlot');root.innerHTML=`<div class="toast">${safe(s)}</div>`;clearTimeout(speechTimer);speechTimer=setTimeout(()=>root.innerHTML='',3400)}
function activity(minutes=0){const d=today();if(!state.dates.includes(d))state.dates.push(d);state.dates=state.dates.slice(-400);if(minutes)state.minutes[d]=(state.minutes[d]||0)+minutes;save()}
function streak(){let n=0;const set=new Set(state.dates);let d=new Date();if(!set.has(today()))d.setDate(d.getDate()-1);while(set.has([d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'))){n++;d.setDate(d.getDate()-1)}return n}
function dueItems(){const now=Date.now();return Object.entries(state.reviews).filter(([,v])=>v&&typeof v.due==='number'&&v.due<=now).map(([id])=>({id,...getItem(id)})).filter(x=>x.de)}
function getItem(id){const [u,i]=id.split(':');const unit=UNITS.find(x=>x.id===u);const it=unit?.items[Number(i)];return it?{de:it[0],cn:it[1],unit}:{} }
function learnedCount(){return Object.keys(state.reviews).length}
function nextUnit(){return UNITS.find(x=>!state.completed[x.id])||UNITS[UNITS.length-1]}
function unitsComplete(){return Object.keys(state.completed).filter(x=>UNITS.some(u=>u.id===x)).length}
function minToday(){return Math.round(state.minutes[today()]||0)}
function navSet(to){cancelVoice();page=to;session=null;review=null;practice=null;render();scrollTo({top:0,behavior:'instant'})}
const NAV=[['home','🏠','首页'],['course','📚','课程'],['review','🧠','复习'],['progress','📈','进度'],['settings','⚙️','设置']];
function navbar(){const make=(p,e,t)=>`<button class="navbtn ${page===p?'active':''}" data-action="nav" data-id="${p}"><span class="nav-emoji">${e}</span><span>${t}</span>${p==='review'&&dueItems().length?`<span class="badgecount">${dueItems().length}</span>`:''}</button>`;
$('#sidebar').innerHTML=`<div class="brand"><div class="brandmark">D<span style="color:#fdba62">.</span></div><div>Deutsch Sprint<small>A1 LEARNING STUDIO</small></div></div><div class="side-nav">${NAV.map(x=>make(...x)).join('')}</div><div class="side-note">🇩🇪 小步前进，真正会用。<br>课程完成 ≠ 通过 A1 考试。</div>`;
$('#bottomNav').innerHTML=NAV.map(([p,e,t])=>`<button data-action="nav" data-id="${p}" class="${page===p?'active':''}"><span class="nav-emoji">${e}</span><span>${t}</span></button>`).join('')}
function topline(crumb='今天的德语'){return `<div class="topline"><span class="crumb">DEUTSCH SPRINT / ${safe(crumb)}</span><span class="date">${safe(dayLabel())}</span></div>`}
function pct(a,b){return Math.max(0,Math.min(100,Math.round((a||0)/(b||1)*100)))}
const progress=(a,b)=>`<div class="progressbar"><span style="width:${pct(a,b)}%"></span></div>`;
function speaker(de,small=false){return `<button class="speaker ${small?'btn-sm':''}" data-action="speak" data-text="${safe(de)}" aria-label="播放德语：${safe(de)}">🔊 ${small?'播放':'听德语发音'}</button>`}
function completedTag(id){return state.completed[id]?'<span class="pill">✓ 已学</span>':'<span class="pill gray">未开始</span>'}
function home(){const n=nextUnit();const c=unitsComplete();const due=dueItems().length;
return topline()+`<div class="eyebrow">DEIN DEUTSCH, DEIN TEMPO · 按自己的节奏</div><section class="hero"><span class="pill" style="background:#397963;color:#edf9ef">🇩🇪 A1 起步计划</span><h1>Hallo!<br>今天也来一点德语。</h1><p>每天 ${state.daily} 分钟，从真实交流开始。先听、再说、再认、最后写。</p><button class="btn btn-primary" data-action="start" data-id="${n.id}">${c===24?'复习最后一课':'开始今天的微课'}　→</button></section>
<div class="stat-grid"><div class="stat"><strong>${c}<span style="font-size:13px;color:#91a99a"> / 24</span></strong><span>已完成单元</span></div><div class="stat"><strong>${streak()} <span style="font-size:13px">天</span></strong><span>连续学习</span></div><div class="stat"><strong>${due}</strong><span>待复习句子</span></div></div>
<div class="section-head"><h2>你的下一步</h2><button class="linkbtn" data-action="nav" data-id="course">全部 24 课　→</button></div>
<div class="cols"><div class="card feature-card"><div class="feature-icon">${n.icon}</div><div class="feature-copy"><span class="pill orange">推荐继续</span><h3 style="margin-top:8px">${safe(n.title)}</h3><p>${safe(n.sub)} · ${n.items.length} 个基础表达</p>${progress(c,24)}<div class="row between" style="margin-top:12px"><span class="tiny">A1 课程进度 ${pct(c,24)}%</span><button class="btn btn-secondary btn-sm" data-action="start" data-id="${n.id}">去学习 →</button></div></div></div>
<div class="card feature-card"><div class="feature-icon">🧠</div><div class="feature-copy"><span class="pill">间隔复习</span><h3 style="margin-top:8px">${due?`${due} 句需要回忆`:'今天暂时没有到期任务'}</h3><p>先努力想起答案，再看解析。错得越多，越快复习。</p><button class="btn btn-outline btn-sm" data-action="nav" data-id="review">${due?'开始复习':'查看记忆卡片'} →</button></div></div></div>
<div class="section-head"><h2>适合你的学习方式</h2></div><div class="study-grid"><div class="card"><h3>🎧 通勤听力</h3><p>自动朗读本课句子；可以放慢速度，跟读两遍。</p><button class="btn btn-outline btn-sm" data-action="commute" data-id="${n.id}">播放句子 🔊</button></div><div class="card"><h3>🎙️ 开口练习</h3><p>先说再核对答案；支持时可用麦克风转文字。</p><button class="btn btn-outline btn-sm" data-action="start" data-id="${n.id}">进入微课 →</button></div></div>
<div class="section-head"><h2>A1 四项能力训练</h2><button class="linkbtn" data-action="nav" data-id="practice">进入专项 →</button></div><div class="card" style="padding:16px"><div class="study-grid"><button class="course" data-action="practice-start" data-id="listen">🎧 听力</button><button class="course" data-action="practice-start" data-id="read">📖 阅读</button><button class="course" data-action="practice-start" data-id="write">✍️ 写作</button><button class="course" data-action="practice-start" data-id="speak">🗣️ 口语</button></div></div><p class="footer">学习数据只保存在当前浏览器。没有注册，也没有服务器上传。</p>`}
function course(){const c=unitsComplete();return topline('学习路径')+`<h1 class="title">A1 学习路径</h1><p class="subtitle">24 个渐进主题 · ${UNITS.reduce((n,u)=>n+u.items.length,0)} 条核心表达 · 听、说、认、写交替练习。可自由进入任意一课。</p><div class="card" style="margin-bottom:17px"><div class="row between"><strong>课程探索进度</strong><span class="pill">${c} / 24</span></div><div style="margin:11px 0">${progress(c,24)}</div><div class="hint">进度代表课程已学过，不代表已独立掌握 A1。</div></div><div class="course-grid">${UNITS.map((u,i)=>`<button class="course" data-action="start" data-id="${u.id}"><div class="course-icon">${u.icon}</div><div class="course-content"><div class="course-meta">LEKTION ${String(i+1).padStart(2,'0')} · ${safe(u.tag)}</div><h3>${safe(u.title)}</h3><p>${safe(u.sub)}</p>${completedTag(u.id)}</div><div class="chevron">›</div></button>`).join('')}</div>`}
function startLesson(id){const u=UNITS.find(x=>x.id===id);if(!u)return;cancelVoice();session={unit:u,phase:0,idx:0,quizIndex:0,answers:[],choice:null,recallIndex:0,revealed:false,recallMiss:[],missionRevealed:false,missionSelf:null,started:Date.now(),typed:'',transcript:'',micError:''};session.questions=sample(u.items.map((_,i)=>i),Math.min(4,u.items.length));session.recalls=sample(u.items.map((_,i)=>i),Math.min(3,u.items.length));page='lesson';render();scrollTo({top:0,behavior:'instant'})}
function sample(xs,n){return [...xs].sort(()=>Math.random()-.5).slice(0,n)}
function audioPhase(){const s=session;const it=s.unit.items[s.questions[s.quizIndex]], correct=it[1];let choices=[correct,...sample(s.unit.items.map(x=>x[1]).filter(x=>x!==correct),3)];choices=sample(choices,choices.length);s.choiceOptions=choices;return choices}
function renderLesson(){const s=session;if(!s)return home();const u=s.unit;const names=['认识句子','听力辨认','主动回忆','开口表达','完成'];let body='';const head=`<div class="lesson-head"><button class="back" data-action="nav" data-id="course">← 课程</button><div><div class="step-tag">LEKTION ${UNITS.indexOf(u)+1} / ${UNITS.length}</div><div class="lesson-title">${safe(u.title)}</div></div></div><div class="phase">${[0,1,2,3,4].map(i=>`<span class="${i<=s.phase?'fill':''}"></span>`).join('')}</div><div class="row between"><span class="pill">${names[s.phase]}</span><span class="tiny">${s.phase+1} / 5</span></div>`;
if(s.phase===0){const it=u.items[s.idx];body=`<div class="word-panel"><div class="step-tag">① 听 · 读 · 认</div><div class="quote de" lang="de">${safe(it[0])}</div><div class="translation">${safe(it[1])}</div><div style="margin-top:20px">${speaker(it[0])}</div></div><div class="hint">先点 🔊 听发音，模仿读两遍，再看中文理解意思。不要求拼写。</div><div class="lesson-actions"><span class="learn-count">第 ${s.idx+1} / ${u.items.length} 句</span><button class="btn btn-primary" data-action="learn-next">${s.idx===u.items.length-1?'开始听力小测':'下一句 →'}</button></div>`}
else if(s.phase===1){const it=u.items[s.questions[s.quizIndex]];if(!s.choiceOptions)s.choiceOptions=audioPhase();body=`<div class="card" style="margin-top:18px"><div class="step-tag">② 听懂声音 · 第 ${s.quizIndex+1} / ${s.questions.length} 题</div><h2 class="prompt">听到的德语是什么意思？</h2><div class="row between" style="margin-bottom:18px">${speaker(it[0])}<span class="tiny">不显示德语原文</span></div><div class="choices">${s.choiceOptions.map((opt,i)=>`<button class="choice ${s.choice===i?(opt===it[1]?'selected good':'selected bad'):''}" data-action="answer" data-id="${i}" ${s.choice!==null?'disabled':''}><span class="choice-letter">${'ABCD'[i]}</span>${safe(opt)}</button>`).join('')}</div>${s.choice!==null?`<div class="feedback ${s.choiceOptions[s.choice]===it[1]?'good':'bad'}">${s.choiceOptions[s.choice]===it[1]?'✓ 回答正确':'✕ 这次没听对'}：${safe(it[0])} = ${safe(it[1])}</div><div class="lesson-actions"><span class="tiny">${speaker(it[0],true)}</span><button class="btn btn-primary" data-action="listen-next">${s.quizIndex===s.questions.length-1?'进入回忆训练':'下一题 →'}</button></div>`:''}</div><div class="hint" style="margin-top:15px">提示：如果听不清，反复点喇叭，但不要直接看文字。</div>`}

function completeLesson(){const s=session;const now=Date.now();const day=today();state.completed[s.unit.id]=day;let added=0;for(let i=0;i<s.unit.items.length;i++){const id=`${s.unit.id}:${i}`;if(!state.reviews[id]){state.reviews[id]={stage:0,due:now+MS_DAY,seen:0};added++}}for(const i of s.recallMiss){const id=`${s.unit.id}:${i}`;state.reviews[id]={...state.reviews[id],due:now+10*60000}}state.missionChecks[s.unit.id]=s.missionSelf;
const duration=Math.max(1,Math.min(45,Math.round((now-s.started)/60000)));activity(duration);state.quizzes.push({unit:s.unit.id,correct:s.answers.filter(Boolean).length,total:s.answers.length,date:day});state.quizzes=state.quizzes.slice(-500);save();toast(`完成微课，${added} 张新卡已进入复习计划`)}
function reviewPage(){const list=dueItems();if(!review){return topline('间隔复习')+`<h1 class="title">记得住，才算学会。</h1><p class="subtitle">简化间隔复习：记不住 10 分钟后再见；记得牢则逐步拉长间隔。</p><div class="stat-grid" style="margin:0 0 24px"><div class="stat"><strong>${list.length}</strong><span>现在到期</span></div><div class="stat"><strong>${learnedCount()}</strong><span>已接触表达</span></div><div class="stat"><strong>${Object.values(state.reviews).filter(x=>x.stage>=3).length}</strong><span>多次回忆成功</span></div></div>${list.length?`<div class="card"><div class="feature-card"><div class="feature-icon">🧠</div><div class="feature-copy"><h3>${list.length} 张卡片等你回忆</h3><p>看中文说德语，翻面后按真实情况评分。</p><button class="btn btn-primary" data-action="review-start">开始复习 →</button></div></div></div>`:`<div class="card empty"><span class="emoji">🌱</span><h3>今天没有到期复习</h3><p>${learnedCount()?'已经学过的句子会在后续日期出现。也可以进行自由练习。':'先完成第一节微课，这里就会自动生成你的记忆卡片。'}</p><button class="btn btn-outline" data-action="review-free" ${learnedCount()?'':'disabled'}>自由练习已学句子</button></div>`}<div class="notice" style="margin-top:14px">评分由你自己决定，因此不会把“看过答案”算作“掌握”。</div>`}

function beginReview(free){let ids=free?Object.keys(state.reviews):dueItems().map(x=>x.id);if(!ids.length)return toast('暂无可复习内容');review={ids:sample(ids,Math.min(15,ids.length)),idx:0,reveal:false,free};render()}
function gradeReview(kind){const id=review.ids[review.idx];const r=state.reviews[id]||{stage:0,seen:0};const now=Date.now();let stage=r.stage||0,delay=0;
if(kind==='again'){stage=0;delay=10*60000}else if(kind==='hard'){stage=Math.max(0,stage-1);delay=MS_DAY}else if(kind==='good'){stage=Math.min(8,stage+1);delay=[1,3,7,14,30,60,90,120][Math.max(0,stage-1)]*MS_DAY}else{stage=Math.min(8,stage+2);delay=[3,7,14,30,60,90,120,180][Math.min(7,stage-1)]*MS_DAY}

area=`<div class="card" style="margin-top:18px"><div class="step-tag">${p.kind==='listen'?'听力理解':'阅读理解'} · ${p.idx+1} / ${tasks.length}</div>${p.kind==='listen'?`<div style="margin-top:25px">${speaker(t.de)}</div><p class="micro">先听声音，别看文字。可以多次播放。</p>`:`<div class="dialog" style="margin-top:17px;white-space:pre-line;line-height:1.85" lang="de">${safe(t.text).replace(/\\n/g,'<br>')}</div>`}<h2 class="prompt">${safe(t.q)}</h2><div class="choices">${t.options.map((op,i)=>`<button class="choice ${p.answered===i?(i===t.a?'selected good':'selected bad'):''}" ${p.answered!==null?'disabled':''} data-action="practice-answer" data-id="${i}"><span class="choice-letter">${'ABC'[i]}</span>${safe(op)}</button>`).join('')}</div>${p.answered!==null?`<div class="feedback ${p.answered===t.a?'good':'bad'}">${p.answered===t.a?'✓ 回答正确':'✕ 回答错误'}。正确答案：${safe(t.options[t.a])}。${safe(t.note||'')}</div><button class="btn btn-primary btn-block" data-action="practice-next">下一题 →</button>`:''}</div>`;
}else{
area=`<div class="card" style="margin-top:18px"><div class="step-tag">${p.kind==='speak'?'口语表达':'简短写作'} · ${p.idx+1} / ${tasks.length}</div><h2 class="prompt" style="margin-top:18px">${safe(t.q)}</h2><div class="notice">${p.kind==='speak'?'请先不看范例，开口讲出来。语音识别功能仅供转写检查。':'先自己写几句话，注意任务要求。写完再对照范例。'}</div>${p.kind==='speak'?`<div class="btn-row" style="margin-top:17px"><button class="btn btn-outline" data-action="mic-practice">🎙️ ${listening?'停止识别':'语音识别'}</button></div>${p.transcript?`<div class="feedback good">识别到：${safe(p.transcript)}<br><small>不代表发音一定正确。</small></div>`:''}${p.micError?`<p class="micro" style="color:var(--red)">${safe(p.micError)}</p>`:''}`:''}<div class="settings-row"><label for="practiceText">${p.kind==='write'?'在这里尝试写德语':'可选：输入你刚才说的德语'}</label><textarea class="textarea" id="practiceText" placeholder="${p.kind==='write'?'例如：Hallo ...':'没有德语键盘也可以不输入'}">${safe(p.typed)}</textarea></div><button class="btn btn-outline btn-block" data-action="practice-reveal">${p.revealed?'再次对照范例':'查看范例及评分要点'}</button>${p.revealed?`<div class="reveal"><div class="step-tag">参考答案（不是唯一答案）</div><p class="de" lang="de" style="font-size:19px;line-height:1.7;font-weight:750">${safe(t.sample)}</p>${speaker(t.sample,true)}<div class="divider"></div><strong style="font-size:13px">检查清单：</strong><div class="checklist" style="margin-top:9px">${t.checks.map(x=>`<label class="checkline"><input type="checkbox">${safe(x)}</label>`).join('')}</div></div><p class="micro">请如实自评，切勿把参考答案当作自动批改结果。</p><div class="btn-row"><button class="btn btn-outline" data-action="practice-self" data-id="no">还没做到</button><button class="btn btn-primary" data-action="practice-self" data-id="yes">我独立完成了 ✓</button></div>`:''}</div>`}
return topline('专项训练')+`<div class="row between"><h1 class="title" style="margin:0">${icon} ${name}</h1><button class="back" data-action="nav" data-id="practice">退出</button></div><p class="subtitle">第 ${p.idx+1} / ${tasks.length} 项 · 逐项打磨 A1 基础能力</p>${progress(p.idx,tasks.length)}${area}`}
function practiceAdvance(correct){const k=practice.kind;practice.attempts++;if(correct)practice.correct++;practice.idx++;practice.answered=null;practice.revealed=false;practice.typed='';practice.transcript='';practice.micError='';if(practice.idx>=practiceBank()[k].length){if(!state.skills||typeof state.skills!=='object')state.skills={read:[],listen:[],write:[],speak:[]};if(!state.skills[k])state.skills[k]=[];state.skills[k].push({date:today(),correct:practice.correct,total:practice.attempts});state.skills[k]=state.skills[k].slice(-50);activity(Math.max(1,Math.ceil(practice.attempts*1.3)));save()}render()}
function progressPage(){const c=unitsComplete();const attempts=state.quizzes.reduce((s,x)=>s+x.total,0);const correct=state.quizzes.reduce((s,x)=>s+x.correct,0);const total=Object.values(state.minutes).reduce((a,b)=>a+b,0);return topline('学习记录')+`<h1 class="title">你的德语成长记录</h1><p class="subtitle">所有指标都来自真实操作记录，不把完成课件等同于真正掌握。</p><div class="stat-grid"><div class="stat"><strong>${c}/24</strong><span>完成课程</span></div><div class="stat"><strong>${streak()} 天</strong><span>连续学习</span></div><div class="stat"><strong>${total}</strong><span>记录分钟</span></div></div><div class="card" style="margin-top:20px"><h2 style="font-size:17px;margin:0 0 13px">A1 学习路径</h2>${progress(c,24)}<p class="micro" style="margin-top:10px">主题探索：${pct(c,24)}% · 已学过 ${learnedCount()} 条表达。</p><div class="divider"></div><h3 style="font-size:15px">客观检测</h3><div class="scoregrid"><div class="scorecell"><strong>${attempts?pct(correct,attempts)+'%':'—'}</strong><small>课程听力</small></div><div class="scorecell"><strong>${attempts}</strong><small>听力题量</small></div><div class="scorecell"><strong>${Object.values(state.reviews).filter(x=>x.stage>=3).length}</strong><small>多次记起</small></div><div class="scorecell"><strong>${state.dates.length}</strong><small>学习天数</small></div></div><p class="micro">听力正确率不等于正式 A1 听力分数；自评口语不作自动达标认证。</p></div>
<div class="section-head"><h2>A1 四项能力检查</h2></div><div class="study-grid"><div class="card"><h3>🎧 听力</h3><p>理解缓慢、清晰的简短生活对话与公告。</p><span class="pill gray">需要模拟考检验</span></div><div class="card"><h3>📖 阅读</h3><p>看懂通知、简单广告、便条与表单。</p><span class="pill gray">需要模拟考检验</span></div><div class="card"><h3>✍️ 写作</h3><p>填写个人信息，写简短生活邮件。</p><span class="pill gray">需要人工反馈</span></div><div class="card"><h3>🗣️ 口语</h3><p>自我介绍、问答、提出简单请求。</p><span class="pill gray">需要真人/教师评估</span></div></div><div class="section-head"><h2>对标歌德 A1</h2></div><div class="card"><p class="hint">建议完成课程后使用歌德学院官方练习材料测试四项能力。App 不是官方考试，也不会直接颁发 A1 证明。</p><a class="source-link" href="https://www.goethe.de/ins/de/en/m/prf/prf/gzsd1/ueb.html" target="_blank" rel="noopener">歌德学院 A1 官方样题与音频</a><a class="source-link" href="https://bfu.goethe.de/a1_sd1/" target="_blank" rel="noopener">歌德学院 A1 在线练习</a></div>`}
function settingsPage(){return topline('个人设置')+`<h1 class="title">学习设置</h1><p class="subtitle">为你的学习节奏做一点个性化调整，数据只存当前设备。</p><div class="card"><div class="settings-row"><label for="name">练习名字（供自我介绍使用）</label><input type="text" id="name" value="${safe(state.name)}" maxlength="40"><p class="micro">默认 Xiao Ming，可自行更改；示例课文不会自动换名。</p></div><div class="settings-row"><label for="daily">每天学习目标</label><select id="daily"><option ${state.daily===10?'selected':''} value="10">10 分钟 · 先试水</option><option ${state.daily===15?'selected':''} value="15">15 分钟 · 稳定习惯（推荐）</option><option ${state.daily===30?'selected':''} value="30">30 分钟 · 稳步推进</option><option ${state.daily===45?'selected':''} value="45">45 分钟 · 强化学习</option></select></div><div class="settings-row"><label for="rate">德语朗读速度</label><select id="rate"><option value="0.7" ${state.rate===.7?'selected':''}>0.7× 慢速</option><option value="0.88" ${state.rate===.88?'selected':''}>0.88× 初学者推荐</option><option value="1" ${state.rate===1?'selected':''}>1× 正常语速</option><option value="1.15" ${state.rate===1.15?'selected':''}>1.15× 加速训练</option></select></div><div class="btn-row"><button class="btn btn-primary" data-action="settings-save">保存设置</button><button class="btn btn-outline" data-action="speak" data-text="Wie geht es dir?">🔊 试听声音</button></div></div>
<div class="section-head"><h2>进度备份</h2></div><div class="card"><p class="hint">本应用没有账号同步。换浏览器、清除网站数据或换手机可能丢失进度。你可以导出备份，再导入恢复。</p><div class="btn-row"><button class="btn btn-outline" data-action="export">⬇ 导出进度 JSON</button><button class="btn btn-outline" data-action="import">⬆ 导入进度 JSON</button><input id="importFile" type="file" accept="application/json,.json" style="display:none"></div><div class="divider"></div><button class="btn btn-ghost btn-sm" style="color:var(--red)" data-action="reset">重置所有学习进度</button></div>
<div class="section-head"><h2>使用说明</h2></div><div class="card coach-tips"><div class="tip"><span>🔊</span><div><strong>发音：</strong>调用手机或浏览器内建德语语音。首次请用 Chrome 打开并检查媒体音量；设备不一定装有离线德语音色。</div></div><div class="tip"><span>🎙️</span><div><strong>口语：</strong>部分浏览器支持语音识别，需要麦克风权限和网络；识别文字不等于发音评分。</div></div><div class="tip"><span>📶</span><div><strong>离线：</strong>课程和进度可在受支持的安装后离线查看；是否能离线朗读由设备德语音色决定。</div></div><div class="tip"><span>🎓</span><div><strong>目标：</strong>需要大量真实听力与写作/口语反馈才能达到 A1。课程完成不能替代考试。</div></div></div>`}
function cancelVoice(){try{speechSynthesis.cancel()}catch{}listening=false;try{recognition?.stop()}catch{}}
let recognition=null;
function voice(de){if(!('speechSynthesis'in window)||!window.SpeechSynthesisUtterance){toast('当前浏览器不支持语音朗读，建议使用 Android Chrome');return}try{speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(de);utter.lang='de-DE';utter.rate=state.rate||.88;utter.pitch=1;const v=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('de'));if(v.length)utter.voice=v.find(x=>x.lang==='de-DE')||v[0];utter.onerror=()=>toast('发音播放失败：请检查系统德语语音包和媒体音量');speechSynthesis.speak(utter)}catch(e){toast('设备语音播放不可用')}}
function commute(unitId){const u=UNITS.find(x=>x.id===unitId);if(!u)return;if(!('speechSynthesis'in window)){toast('浏览器不支持语音朗读');return}cancelVoice();toast('开始播放本课句子，每句重复两遍；再次点喇叭可停止');const texts=u.items.flatMap(x=>[x[0],x[0]]);let i=0;const next=()=>{if(i>=texts.length)return;const utter=new SpeechSynthesisUtterance(texts[i++]);utter.lang='de-DE';utter.rate=state.rate;const v=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('de'));if(v.length)utter.voice=v.find(x=>x.lang==='de-DE')||v[0];utter.onend=next;utter.onerror=()=>toast('朗读被中断');speechSynthesis.speak(utter)};next()}
function tryMic(){const target=page==='practice'?practice:session;if(!target)return;const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Rec){target.micError='当前浏览器不支持语音识别。你仍然可以自己说，再对照参考答案。';render();return}if(recognition){try{recognition.abort()}catch{}recognition=null;listening=false;render();return}try{recognition=new Rec();recognition.lang='de-DE';recognition.interimResults=false;recognition.maxAlternatives=1;recognition.onresult=e=>{target.transcript=e.results[0][0].transcript;target.micError='';render()};recognition.onerror=e=>{target.micError='识别未完成（'+e.error+'）。可直接自评，不会影响学习。';render()};recognition.onend=()=>{recognition=null;listening=false;render()};listening=true;recognition.start();render()}catch{listening=false;recognition=null;target.micError='无法打开麦克风。请检查浏览器权限和 HTTPS。';render()}}
function render(){navbar();let html='';if(page==='home')html=home();else if(page==='course')html=course();else if(page==='lesson')html=renderLesson();else if(page==='review')html=reviewPage();else if(page==='progress')html=progressPage();else if(page==='settings')html=settingsPage();else if(page==='practice')html=practicePage();$('#app').innerHTML=html}
function clickHandler(e){const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;const v=el.dataset.id;const de=el.dataset.text;
if(a==='nav')return navSet(v);if(a==='practice-start')return beginPractice(v);
if(a==='practice-answer'&&practice?.answered===null){practice.answered=Number(v);render();return}
if(a==='practice-next'){const t=practiceBank()[practice.kind][practice.idx];return practiceAdvance(practice.answered===t.a)}
if(a==='practice-reveal'){practice.typed=$('#practiceText')?.value||'';practice.revealed=true;render();return}
if(a==='practice-self'){return practiceAdvance(v==='yes')}
if(a==='mic-practice'){practice.typed=$('#practiceText')?.value||'';return tryMic()}
if(a==='speak')return voice(de);if(a==='commute')return commute(v);if(a==='start')return startLesson(v);
if(a==='learn-next'){if(session.idx<session.unit.items.length-1)session.idx++;else session.phase=1;render();return}
if(a==='answer'&&session.choice===null){session.choice=Number(v);const it=session.unit.items[session.questions[session.quizIndex]];session.answers.push(session.choiceOptions[session.choice]===it[1]);render();return}
if(a==='listen-next'){if(session.quizIndex<session.questions.length-1){session.quizIndex++;session.choice=null;session.choiceOptions=null}else session.phase=2;render();return}
if(a==='reveal-recall'){session.revealed=true;render();return}
if(a==='recall-grade'){if(v==='miss')session.recallMiss.push(session.recalls[session.recallIndex]);if(session.recallIndex<session.recalls.length-1){session.recallIndex++;session.revealed=false}else session.phase=3;render();return}
if(a==='mic'){if(session)session.typed=$('#missionText')?.value||'';return tryMic()}
if(a==='mission-reveal'){session.typed=$('#missionText')?.value||'';session.missionRevealed=true;render();if(session.typed){const [_,model]=session.unit.mission;let normalize=s=>String(s).toLowerCase().normalize('NFKC').replace(/[^a-zäöüß ]/g,'').replace(/\s+/g,' ').trim();toast(normalize(model)===normalize(session.typed)?'书面内容与参考答案匹配':'参考答案仅供对照：可检查词序、动词、大小写');}return}
if(a==='mission-done'){session.missionSelf=v;session.phase=4;completeLesson();render();scrollTo({top:0,behavior:'smooth'});return}
if(a==='review-start')return beginReview(false);if(a==='review-free')return beginReview(true);if(a==='review-reveal'){review.reveal=true;render();return}if(a==='review-grade')return gradeReview(v);
if(a==='settings-save'){const n=$('#name').value.trim();state.name=n||'Xiao Ming';state.daily=Number($('#daily').value)||15;state.rate=Number($('#rate').value)||.88;save();toast('设置已保存');render();return}
if(a==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='DeutschSprint-progress-'+today()+'.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);return}
if(a==='import'){const input=$('#importFile');input.click();return}
if(a==='reset'){if(confirm('确定清空所有学习记录？此操作不能撤销，建议先导出备份。')){state=initial();save();navSet('home');toast('学习记录已重置')}return}}
document.addEventListener('click',clickHandler);
document.addEventListener('change',async e=>{if(e.target.id!=='importFile')return;const file=e.target.files?.[0];if(!file)return;try{if(file.size>3e6)throw Error('文件太大');const val=JSON.parse(await file.text());if(val.version!==1||!val.completed||!val.reviews||!Array.isArray(val.dates)||typeof val.completed!=='object'||typeof val.reviews!=='object')throw Error('格式不符');if(!confirm('导入会覆盖当前本机进度。确定继续？'))return;state={...initial(),...val};save();navSet('progress');toast('进度导入成功')}catch(e){toast('导入失败：'+e.message)}});
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
})();

</script></body></html>
